plugins { id 'com.android.application' }
android {
    namespace 'app.myworks'
    compileSdk 34
    defaultConfig {
        applicationId 'app.myworks'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file('myworks.jks')
            storePassword 'myworks123'
            keyAlias 'myworks'
            keyPassword 'myworks123'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'mjs', 'html' }
}
